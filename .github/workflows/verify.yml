name: Verify

on:
  pull_request:
  # GitHub 偶尔丢 pull_request 事件（推送时 500），这时可以在 Actions 页对分支手动补跑。
  workflow_dispatch:
    inputs:
      bench_release:
        description: '另在 Release（-O）下跑一遍 ShiziCore 的性能量测（BENCH 行）；verify:core 的 swift test 是 Debug，量出的毫秒数偏大'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# 每个提交各跑一次、互不取消：多批改动连续合入时，每批都有自己完整的结果（公开仓库，托管 runner 不计费）。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

# 四个互相独立的 job：
#   data       （ubuntu）脚本语法检查 + 不需要 Swift 的数据门禁（vector440、assets、order）
#   unit-copy  （ubuntu）verify:unit (node:test) + verify:copy + verify:tokens
#   swift-core （macOS）verify:core（ShiziCore 编译 + swift test）、要 shizi-core-cli 的 verify:governance /
#               verify:content，以及 verify:unit 里只在 macOS 跑的用例（test/core/helpers.mjs NEEDS_SWIFT）
#   ios-app    （macOS）App 模拟器构建 + 包内资源核对、三个测试 target 编译、ShiziStoreTests / ShiziWriteTests 在模拟器上跑
# 不在 CI 里的：逐屏对比与 XCUITest 流程（pnpm run verify:native-ui，约 1 小时、要固定的模拟器机型与运行时）、
# Release archive 与签名（ios/ShiziApp/scripts/verify-local.sh、真机），都在本机跑。

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # verify_vector_data_440.js renders all 440 supplement glyphs in a browser.
        run: pnpm exec playwright install --with-deps chromium
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          # node --check every scripts/**/*.{js,mjs,cjs}.
          find scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | sort -z | xargs -0 -n1 node --check
          python3 -m py_compile scripts/*.py
          for script in ios/ShiziApp/scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Verify data integrity (no-Swift gates)
        # governance + content need shizi-core-cli (Swift) and run locally only; see the header comment.
        run: |
          pnpm run verify:vector440
          pnpm run verify:assets
          pnpm run verify:order

  unit-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run verify:unit
      - name: Copy check
        run: pnpm run verify:copy
      - name: Token check
        run: pnpm run verify:tokens

  swift-core:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release benchmarks (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bench_release }}
        shell: bash
        run: |
          swift test -c release -Xswiftc -enable-testing --package-path ios/ShiziCore \
            --filter 'AColdStartBenchmarkTests|DeckBuildEquivalenceTests|StoreCommitBenchmarkTests' 2>&1 \
            | grep -E "BENCH|error:|Executed [0-9]+ tests?|failed" | tee "$RUNNER_TEMP/bench-release.txt"
      - name: ShiziCore build + tests (verify:core)
        run: pnpm run verify:core
      - name: Library governance (needs shizi-core-cli)
        run: pnpm run verify:governance
      - name: Content corpus (needs shizi-core-cli)
        run: pnpm run verify:content
      - name: Unit tests incl. macOS-only cases
        run: pnpm run verify:unit
      # 日志接口只给一个 job 的最后几千行：Release 量测结果在 job 末尾再打印一次
      - name: Release benchmarks (repeat at end of log)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.bench_release }}
        run: cat "$RUNNER_TEMP/bench-release.txt" || true

  ios-app:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: ios/ShiziApp/ShiziApp.xcodeproj
      DD: ios/ShiziApp/build/ci-dd
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build app (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme Shizi -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Bundle assets
        run: bash ios/ShiziApp/scripts/verify-bundle-assets.sh "$DD/Build/Products/Debug-iphonesimulator/Shizi.app"
      - name: Pick a simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')"
          echo "Simulator: $UDID"
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - name: Compile UI test target (ShiziUITests; not run in CI)
        run: |
          xcodebuild -project "$PROJECT" -scheme ShiziUITests -destination "id=$SIM" -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO build-for-testing -quiet
      - name: ShiziStoreTests
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme ShiziStoreTests -destination "id=$SIM" -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/ShiziStoreTests.log" \
            | grep -E "Executed [0-9]+ tests?|error:|BENCH|\*\* TEST (SUCCEEDED|FAILED)" | grep -v "^Test Case .* passed" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/ShiziStoreTests.log"
      - name: ShiziWriteTests
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme ShiziWriteTests -destination "id=$SIM" -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/ShiziWriteTests.log" \
            | grep -E "Executed [0-9]+ tests?|error:|BENCH|\[library-eq\]|\*\* TEST (SUCCEEDED|FAILED)" | grep -v "^Test Case .* passed" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/ShiziWriteTests.log"
