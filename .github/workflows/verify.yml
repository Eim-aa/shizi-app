name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs run in parallel (02-实现计划 §0 门禁):
#   data       — syntax checks + verify:data (governance, vector440, content, assets, sw-unit)
#   unit-copy  — verify:unit (node:test) + verify:copy
#   web        — verify:web (Playwright against a local static server)
# scripts/legacy/ holds retired v8/v9 gates; it is neither syntax-checked nor run.

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # verify_vector_data_440.js renders all 440 supplement glyphs in a browser.
        run: pnpm exec playwright install --with-deps chromium
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          # node --check every scripts/**/*.{js,mjs,cjs} except scripts/legacy/.
          find scripts -path scripts/legacy -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | sort -z | xargs -0 -n1 node --check
          python3 -m py_compile scripts/*.py ios/ShiziApp/scripts/validate-native-smoke.py
          for script in ios/ShiziApp/scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Verify data integrity
        run: pnpm run verify:data

  unit-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run verify:unit
      - name: Copy check
        run: pnpm run verify:copy

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start local app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/shizi-server.log 2>&1 &
          echo $! >/tmp/shizi-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/shizi-server.log
          exit 1
      - name: Run browser regressions
        run: pnpm run verify:web
      - name: Stop local app
        if: always()
        run: test ! -f /tmp/shizi-server.pid || kill "$(cat /tmp/shizi-server.pid)" || true
