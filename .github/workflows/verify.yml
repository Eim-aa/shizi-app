name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# D84：网页版（web job、API floor、sw-unit、PWA 门禁）已随网页一起删除。剩两个互相独立的 job：
#   data       — 脚本语法检查 + 不需要 Swift 的数据门禁（vector440、assets、order）
#   unit-copy  — verify:unit (node:test) + verify:copy + verify:tokens
# verify:governance 与 verify:content 要用 `swift build` 出的 shizi-core-cli（cards-dump）展开题库，ubuntu 上没有 Swift，
# 且决定不加 macOS runner：这两项只在本机跑（pnpm run verify:data / bash ios/ShiziApp/scripts/verify-local.sh）。
# verify:unit 里同样要展开题库的用例（content-blocklist、font-loader 覆盖）在非 macOS 上自动跳过（test/core/helpers.mjs NEEDS_SWIFT）。

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # verify_vector_data_440.js renders all 440 supplement glyphs in a browser.
        run: pnpm exec playwright install --with-deps chromium
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          # node --check every scripts/**/*.{js,mjs,cjs}.
          find scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | sort -z | xargs -0 -n1 node --check
          python3 -m py_compile scripts/*.py
          for script in ios/ShiziApp/scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Verify data integrity (no-Swift gates)
        # governance + content need shizi-core-cli (Swift) and run locally only; see the header comment.
        run: |
          pnpm run verify:vector440
          pnpm run verify:assets
          pnpm run verify:order

  unit-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run verify:unit
      - name: Copy check
        run: pnpm run verify:copy
      - name: Token check
        run: pnpm run verify:tokens
