<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>79 字待问题复核</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:1200px;margin:auto;padding:24px;line-height:1.5}header{margin-bottom:24px}.warning{padding:14px 16px;border:2px solid #b91c1c;border-radius:12px;background:#fee2e2;color:#7f1d1d}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #8886;border-radius:14px;padding:14px;background:#8881}.glyph{width:180px;height:180px;margin:auto}.meta{font:12px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.status{color:#b91c1c;font-weight:700}button{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid #888;background:Canvas;cursor:pointer}@media(prefers-color-scheme:dark){.warning{background:#450a0a;color:#fecaca}}
</style>
</head>
<body>
<header>
<h1>strokeorder 路线 79 字待问题复核</h1>
<p class="warning"><strong>当前状态：整批暂不通过。</strong>项目负责人在初次同意后发现有几个问题字，并明确撤回批准。当前 79/79 均保持待复核，等待列出具体问题字。</p>
<p>请继续逐字查看结构、笔顺、方向和整体风格。浏览或播放不会把任何字符改成 accepted。</p>
</header>
<div class="toolbar"><button id="play-all">依次播放当前可见项</button><span id="summary">正在载入…</span></div>
<main id="grid" class="grid"></main>
<script src="../../hanzi-writer.min.js"></script>
<script>
const writers=[];
async function load(){
 const review=await fetch("strokeorder-79-pending-review.json").then(r=>r.json());
 document.getElementById("summary").textContent=`共 ${review.counts.total} 字：严格路线 ${review.counts.strict}，0.99 路线 ${review.counts.relaxed_0_99}；当前通过 0。`;
 const grid=document.getElementById("grid");
 for(const row of review.records){
  const card=document.createElement("article");card.className="card";
  const title=document.createElement("h2");title.textContent=row.character;card.appendChild(title);
  const glyph=document.createElement("div");glyph.className="glyph";card.appendChild(glyph);
  const status=document.createElement("p");status.className="status";status.textContent="待问题复核";card.appendChild(status);
  const meta=document.createElement("p");meta.className="meta";meta.textContent=`${row.normative_stroke_count} 笔 · ${row.runtime.variant} · ${row.final_data_sha256}`;card.appendChild(meta);
  const button=document.createElement("button");button.textContent="逐笔播放";card.appendChild(button);grid.appendChild(card);
  const writer=HanziWriter.create(glyph,row.character,{width:180,height:180,padding:10,strokeAnimationSpeed:2,delayBetweenStrokes:120,showCharacter:true,charDataLoader:(_,done,fail)=>fetch(`../../${row.final_data_path}`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(done).catch(fail)});
  button.addEventListener("click",()=>writer.animateCharacter());writers.push({card,writer});
 }
}
document.getElementById("play-all").addEventListener("click",async()=>{for(const item of writers){if(item.card.getBoundingClientRect().bottom>=0&&item.card.getBoundingClientRect().top<=innerHeight){await item.writer.animateCharacter()}}});
load().catch(error=>{document.getElementById("summary").textContent="载入失败：请从仓库根目录启动本地 HTTP 服务。";console.error(error)});
</script>
</body>
</html>
