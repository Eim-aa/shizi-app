const QH={4:96,5:114,7:150};
const PERIOD={dawn:'早上',noon:'中午',dusk:'傍晚',night:'晚上'};
// 叶影（晨为基准；坐标沿用交接版）。a 不透明度，b 模糊，c 颜色
const BRANCHES=[
  {x:-52,y:-26,w:246,h:26,rot:26,twig:{y:11,a:.10,b:7},c:'88,97,70',leaves:[
    {l:26,t:-16,w:58,h:21,r:'50% 12% 50% 12%',rot:-39,a:.16,b:6},{l:62,t:14,w:54,h:19,r:'12% 50% 12% 50%',rot:35,a:.16,b:6},
    {l:100,t:-16,w:56,h:20,r:'50% 12% 50% 12%',rot:-43,a:.16,b:6},{l:140,t:13,w:48,h:17,r:'12% 50% 12% 50%',rot:30,a:.085,b:13}]},
  {x:-74,y:96,w:250,h:30,rot:14,twig:{y:13,a:.07,b:10},c:'92,100,74',leaves:[
    {l:36,t:-17,w:62,h:23,r:'50% 12% 50% 12%',rot:-36,a:.08,b:15},{l:84,t:15,w:58,h:22,r:'12% 50% 12% 50%',rot:33,a:.07,b:16},
    {l:134,t:-16,w:56,h:21,r:'50% 12% 50% 12%',rot:-40,a:.065,b:15}]}
];
// 今天（9 月 24 日）判断过的字，按判断先后；「户」跳过，不放
const TODAY=[['数','R'],['感','R'],['警','W'],['部','R'],['主','R'],['虽','R']];
const WRONG={'警@9-24':{drop:[13],tilt:{from:12,dx:6,dy:10,a:5}}};
const REAL_FIX={};
const ST=window.__szStore||(window.__szStore={data:{},pend:{}});
function load(c){
  if(ST.data[c]!==undefined) return Promise.resolve(ST.data[c]);
  if(!ST.pend[c]) ST.pend[c]=fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(c)+'.json').then(r=>r.json()).then(d=>(ST.data[c]=d)).catch(()=>(ST.data[c]=null));
  return ST.pend[c];
}

class Component extends DCLogic {
  layerRef=React.createRef();
  componentDidMount(){
    this.reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    Promise.all(TODAY.map(([c])=>c).concat((this.props.records||[]).filter(r=>!r.strokes).map(r=>r.c)).map(load)).then(()=>{if(!this._gone)this.forceUpdate();});
    const wait=()=>{if(this._gone)return;if(window.SZInk)this.forceUpdate();else setTimeout(wait,60);};wait();
    this.onInk=()=>{if(!this._gone)this.forceUpdate();}; window.addEventListener('szink',this.onInk);
  }
  componentWillUnmount(){this._gone=true; window.removeEventListener('szink',this.onInk);}
  // 时段切换：淡入 600ms，不做持续摆动；减少动态效果时直接切换
  componentDidUpdate(){ const was=this._per; this._per=this.props.period; if(was!==undefined&&was!==this.props.period&&!this.reduce){const el=this.layerRef.current; if(el&&el.animate) el.animate([{opacity:0},{opacity:1}],{duration:600,easing:'ease-out'});} }
  period(){const p=this.props.period||'dawn'; if(p!=='auto') return PERIOD[p]?p:'dawn'; const h=new Date().getHours(); return h>=5&&h<10?'dawn':h<15&&h>=10?'noon':h>=15&&h<19?'dusk':'night';}
  // 与 ShiziScreen 的 hand() 同算法、同种子：同一条记录在首页和练习记录里是同一份笔迹
  // 第九稿：今天的字从 records 实时算，按判断先后去重（同一个字只留最近一次）
  todayList(R,today){const m=new Map(); R.forEach(r=>{if(r.d===today&&(r.v==='R'||r.v==='W')){m.delete(r.c); m.set(r.c,r);}}); return [...m.values()];}
  hand(c,d,v,live){const h=React.createElement,D=ST.data[c];
    if(live&&live.length&&window.SZInk) return h('svg',{viewBox:'0 0 '+S+' '+S,width:26,height:26,style:{display:'block'}},live.map((p,i)=>p.length?h('path',{key:i,d:SZInk.outline(p,FLOOR),style:{fill:'var(--i1)'}}):null));
    if(!D||!window.SZInk) return null;
    const rec=SZInk.pick(c,v==='W'?'wrong':'normal'); let strokes=[];
    // 与 ShiziScreen 一致：没有登记的写错记录用默认 WRONG；错位支持 tilt.to；真人样本不像错的（REAL_FIX）同样删笔、错位
    const W=v==='W'?WRONG[c+'@'+d]||{drop:[Math.floor(D.medians.length*.6)],tilt:{from:Math.floor(D.medians.length*.5),dx:-20,dy:18,a:-10}}:{};
    if(rec) strokes=v==='W'&&REAL_FIX[c]?SZInk.wrongFix(SZInk.fromRecord(rec),W,S/2):SZInk.fromRecord(rec);
    else { let seed=0;for(const ch of (c+d)) seed=(seed*31+ch.charCodeAt(0))%233280;
      const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280-.5;};
      const a=(rnd()*6)*Math.PI/180, sc=.84+rnd()*.06, cc=S/2;
      D.medians.forEach((m,idx)=>{ if(W.drop&&W.drop.includes(idx)) return;
        const t=W.tilt&&idx>=W.tilt.from&&(W.tilt.to==null||idx<=W.tilt.to)?W.tilt:null, ta=t?t.a*Math.PI/180:0;
        strokes.push(SZInk.synth(m.map(([x,y])=>{let px=x*KK+OFF-cc,py=(900-y)*KK+OFF-cc;
          if(t){const qx=px*Math.cos(ta)-py*Math.sin(ta),qy=px*Math.sin(ta)+py*Math.cos(ta);px=qx+t.dx;py=qy+t.dy;}
          return {x:cc+(px*Math.cos(a)-py*Math.sin(a))*sc+3+rnd()*5,y:cc+(px*Math.sin(a)+py*Math.cos(a))*sc-1+rnd()*5};})));}); }
    return h('svg',{viewBox:'0 0 '+S+' '+S,width:26,height:26,style:{display:'block'}},strokes.map((p,i)=>p.length?h('path',{key:i,d:SZInk.outline(p,FLOOR),style:{fill:'var(--i1)'}}):null));}
  // 3.2 光影层（装饰，不作令牌）
  lightLayer(per,dark){
    const h=React.createElement, kids=[];
    if(per!=='night'){
      const noon=per==='noon', dusk=per==='dusk', k=noon?.7:1, db=noon?3:0;
      if(!dark) kids.push(h('div',{key:'base',style:{position:'absolute',inset:0,background:'radial-gradient(130% 90% at '+(noon?'50%':'-10%')+' -20%,rgba('+(dusk?'120,86,52':'103,110,84')+','+(.085*k)+'),rgba('+(dusk?'120,86,52':'103,110,84')+','+(.03*k)+') 42%,transparent 70%)'}}));
      BRANCHES.forEach((b,bi)=>{
        const col=(a)=>dark?'rgba(0,0,0,.30)':'rgba('+(dusk?'120,86,52':b.c)+','+(dusk?.10:a*k)+')', blur=(x)=>dark?12:x+db;
        kids.push(h('div',{key:'b'+bi,style:{position:'absolute',left:b.x+(noon?126:0),top:b.y,width:b.w,height:b.h,transform:'rotate('+b.rot+'deg)',transformOrigin:'left center'}},
          h('div',{style:{position:'absolute',left:0,top:b.twig.y,width:b.w,height:3,borderRadius:2,background:dark?'rgba(0,0,0,.30)':'rgba('+(dusk?'120,86,52':'88,97,70')+','+(b.twig.a*k)+')',filter:'blur('+blur(b.twig.b)+'px)'}}),
          b.leaves.map((f,i)=>h('div',{key:i,style:{position:'absolute',left:f.l,top:f.t,width:f.w,height:f.h,borderRadius:f.r,transform:'rotate('+f.rot+'deg)',background:col(f.a),filter:'blur('+blur(f.b)+'px)'}}))));
      });
      if(!dark) kids.push(h('div',{key:'sun',style:{position:'absolute',inset:0,background:'linear-gradient(200deg,rgba(255,252,243,.42) 0%,rgba(255,252,243,0) 46%)'}}));
    } else if(!dark) kids.push(h('div',{key:'lamp',style:{position:'absolute',left:0,top:0,width:393,height:852,background:'radial-gradient(275px 383px at 346px -43px,rgba(255,196,130,.08),transparent 70%)'}}));
    return h('div',{ref:this.layerRef,style:{position:'absolute',left:0,top:0,width:393,height:per==='night'?852:330,overflow:'hidden',pointerEvents:'none',transform:per==='dusk'?'scaleX(-1)':'none'}},kids);
  }
  renderVals(){
    const P=this.props, dark=P.theme==='th1', t=dark?TH.dark:TH.light, per=this.period(), lamp=P.lamp??.05;
    // 第九稿第四批：紧凑版（size="compact"，360×640）——按 ShiziScreen 紧凑版规则新画，文字放大一档、间距收紧
    const C=P.size==='compact';
    const qi=P.quote==='5'?1:P.quote==='7'?2:P.quote==='4'?0:(267%QUOTES.length), Q=QUOTES[qi], n=Q.q[0].length-1, colH=QH[n]||96;
    const btn=(P.pressed??false)?t.down:(FILLS[P.fill]||t.btn);
    const vars={}; Object.keys(t).forEach(k=>{if(k.startsWith('--'))vars[k]=t[k];}); vars['--btn']=btn; vars['--down']=t.down;
    const state=P.state??'record', today=P.today||'9-24', list=P.records?this.todayList(P.records,today):TODAY.map(([c,v])=>({c,v})), recs=list.slice(-8);
    const nav=k=>P.onNavigate?()=>P.onNavigate(k):undefined;
    return {
      frame:Object.assign({position:'relative',width:C?360:393,height:C?640:852,borderRadius:P.bare?0:C?28:42,overflow:'hidden',background:'var(--p)',backgroundImage:dark?'radial-gradient(275px 383px at 346px -43px,rgba(255,214,170,'+lamp+'),transparent 70%)':'none',backgroundRepeat:'no-repeat',boxShadow:P.bare?'none':'0 26px 64px rgba(48,38,26,.18),0 2px 8px rgba(48,38,26,.10)',fontFamily:"-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif",WebkitFontSmoothing:'antialiased'},vars),
      lightLayer:this.lightLayer(per,dark),
      periodCh:PERIOD[per],
      q1:Q.q[0], q2:Q.q[1], src:Q.src,
      qCol:{writingMode:'vertical-rl',height:colH,lineHeight:1,letterSpacing:'.286em'},
      srcCol:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,paddingTop:70+(colH-96)/2},
      isBlock:(P.entry??'block')!=='bar', isBar:P.entry==='bar',
      ctaLabel:(P.resume??false)?'继续写字':'开始写字',
      hasInk:state==='record', hasInkS:state==='record'&&!P.resumeLine,
      resumeOn:!!P.resumeLine, noResume:!P.resumeLine, resumeLine:P.resumeLine||'', otherOn:!!P.resumeLine&&!!P.otherLine, otherLine:P.otherLine||'', pickTopC:P.resumeLine&&P.otherLine?'522px':'484px',
      inkRow:state==='record'?recs.map(r=>({el:this.hand(r.c,today,r.v,r.strokes)})):[],
      // 第九稿审美返修 A09：紧凑版墨迹和计数合成一行，360 宽只放得下最近 4 个字的墨迹
      inkRowC:state==='record'&&C?list.slice(-4).map(r=>({el:this.hand(r.c,today,r.v,r.strokes)})):[],
      isStd:!C, isCompact:C, srcColC:{display:'flex',flexDirection:'column',alignItems:'center',gap:8,paddingTop:56+(colH-96)/2},
      chrome:!P.bare, shield:!!P.onNavigate, onStart:nav('start'), onPick:nav('pick'), onInk:nav('records'), onTabLib:nav('library'), onOther:nav('other'), onTabMine:nav('mine'),
      rowText:({record:'今天记录了 '+list.length+' 个字',empty:'',first:'第一次来，先写 5 个字试试。'})[state]??''
    };
  }
}
</script>
